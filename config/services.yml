# config/services.yaml
parameters:
  # UI languages offered by the admin frontend. Each needs a translations/frontend+intl-icu.<locale>.xlf file.
  # The first entry is used when the browser asks for none of them.
  phplist_frontend.locales: ['en', 'es']

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
    bind:
      $projectDir: '%kernel.project_dir%'

  PhpList\WebFrontend\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  PhpList\WebFrontend\Controller\:
    resource: '../src/Controller'
    public: true
    autowire: true
    tags: ['controller.service_arguments']

  Symfony\Component\HttpFoundation\Session\SessionInterface: '@session'

  PhpList\RestApiClient\Client:
    $baseUrl: '%app.api_base_url%'

  PhpList\WebFrontend\EventListener\ApiSessionListener:
    tags:
      - { name: kernel.event_subscriber }

  PhpList\WebFrontend\Service\PhpListTranslationLoader:
    arguments:
      $projectDir: '%kernel.project_dir%'
    tags:
      - { name: translation.loader, alias: phplist }

  PhpList\WebFrontend\Twig\HtmlCleanupExtension:
    tags: [ 'twig.extension' ]

  PhpList\WebFrontend\Service\LocalePreference:
    arguments:
      $supportedLocales: '%phplist_frontend.locales%'

  PhpList\WebFrontend\Twig\TranslationsExtension:
    tags: [ 'twig.extension' ]
    arguments:
      $supportedLocales: '%phplist_frontend.locales%'

